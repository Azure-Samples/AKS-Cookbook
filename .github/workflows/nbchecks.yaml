name: notebook-checks

on:
  pull_request:
    paths:
      - "**/*.ipynb"
    branches: [main]
  push:
    paths:
      - "**/*.ipynb"
    branches: [main]
  
permissions:
  contents: read
  pull-requests: write

jobs:
  nbchecks:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@0f07f7f756721ebd886c2462646a35f78a8bc4de # v1.2.4
        with:
          python-version: "3.12"
      - uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1.2.0
      - name: nbchecks
        run: |
          python ./.github/workflows/nbchecks.py

